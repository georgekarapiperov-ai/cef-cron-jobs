name: Data - Holdings
# Runs the existing Vercel code in GitHub Actions with a file-based store (no Upstash) and publishes
# the results to the data-holdings branch, which the app reads directly. Free and unlimited for public repos.
on:
  schedule:
    - cron: "0 14 * * 1-5"    # daily, 10 AM New York
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the file-based store instead of Upstash
        run: |
          npm pkg set type=module
          mkdir -p node_modules/@vercel/kv
          cp scripts/kv-file-shim.mjs node_modules/@vercel/kv/index.mjs
          echo '{"name":"@vercel/kv","type":"module","exports":"./index.mjs"}' > node_modules/@vercel/kv/package.json
      - name: Get the previous data
        run: |
          mkdir -p out
          if git fetch -q --depth=1 origin data-holdings; then git --work-tree=out checkout FETCH_HEAD -- . ; else echo "first run"; fi
      - name: Build
        run: node scripts/run-job.mjs holdings out

      - name: Publish to the data-holdings branch
        run: bash scripts/publish-data.sh out data-holdings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

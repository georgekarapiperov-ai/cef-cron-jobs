# .github/workflows/news-check.yml
#
# WHAT THIS DOES: GitHub's own free scheduler calls your deployed
# news-check endpoint every 10 minutes — this is the actual "every 5-15
# minutes" trigger, since Vercel's free plan cron can't run more than once
# a day. GitHub Actions has no such restriction and costs nothing for a
# job this small and infrequent.
#
# WHERE TO PUT IT: create the folders .github/workflows/ in your repo (same
# "type a path with slashes" trick as before) and save this exact content
# as news-check.yml inside it.
#
# NOTE ON TIMING: GitHub says scheduled workflows can be delayed during
# periods of high platform load, especially for schedules tighter than
# hourly — so "every 10 minutes" is a target, not a guarantee to the
# second. That's fine for this use case; it just means occasional runs
# might land a few minutes late rather than exactly on time.

name: News Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you also trigger it manually from GitHub's Actions tab, for testing

jobs:
  ping-news-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call the news-check endpoint
        run: curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://cef-cron-jobs.vercel.app/api/news-check

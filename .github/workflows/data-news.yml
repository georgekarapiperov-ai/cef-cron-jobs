name: Data - News
# Runs the existing Vercel code in GitHub Actions with a file-based store (no Upstash) and publishes
# the results to the data-news branch, which the app reads directly. Free and unlimited for public repos.
on:
  schedule:
    - cron: "*/15 10-23 * * 1-5"   # every 15 min, ~6 AM-8 PM New York, weekdays
    - cron: "0 0,3,6,9 * * 1-5"    # every 3 h overnight
    - cron: "0 */3 * * 0,6"        # every 3 h at weekends
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the file-based store instead of Upstash
        run: |
          npm pkg set type=module
          mkdir -p node_modules/@vercel/kv
          cp scripts/kv-file-shim.mjs node_modules/@vercel/kv/index.mjs
          echo '{"name":"@vercel/kv","type":"module","exports":"./index.mjs"}' > node_modules/@vercel/kv/package.json
      - name: Get the previous data
        run: |
          mkdir -p out
          if git fetch -q --depth=1 origin data-news; then git --work-tree=out checkout FETCH_HEAD -- . ; else echo "first run"; fi
      - name: Build
        run: node scripts/run-job.mjs news out
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          NEWSFILTER_API_KEY: ${{ secrets.NEWSFILTER_API_KEY }}
      - name: Publish to the data-news branch
        run: bash scripts/publish-data.sh out data-news
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

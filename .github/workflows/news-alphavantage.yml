name: News - Alpha Vantage
on:
  # schedule PAUSED 2026-10-05: the Upstash KV database is over its free-plan limit, so this job
  # cannot save anything (news is served live by api/news.js meanwhile). To switch it back on,
  # replace these comment lines with:   schedule:   and   - cron: "10 11,15,19,23 * * 1-5"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS --max-time 60 -o /dev/null -w "HTTP %{http_code}\n" https://cef-cron-jobs.vercel.app/api/news-alphavantage
